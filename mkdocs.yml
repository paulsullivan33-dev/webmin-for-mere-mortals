site_name: Webmin for Mere Mortals
site_description: A web control panel for a Linux machine, taught from a loopback lab. Installing Webmin from its release tarball, binding it to localhost, signing in, creating and removing a system user through its own pages, giving a Webmin user exactly one module, reading its configuration files and audit log, and knowing its limits, with the security line stated plainly.
site_url: https://paulsullivan33-dev.github.io/webmin-for-mere-mortals/
